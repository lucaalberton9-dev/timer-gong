<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer Gong</title>
<meta name="description" content="Timer a sequenza per la meditazione, con gong.">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timer Gong">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;400;500&display=swap">
<style>
/* Layout: una sola colonna centrata. Numero grande, durate come piccole pillole, un pulsante tondo. Nessun altro elemento. */
:root {
  --bg: #0A0A0A;
  --fg: #F2F2EF;
  --muted: #7E7E79;
  --line: #2B2B29;
  --font: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FAFAF7;
    --fg: #111110;
    --muted: #84847E;
    --line: #DCDCD6;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FAFAF7;
  --fg: #111110;
  --muted: #84847E;
  --line: #DCDCD6;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.app {
  height: 100%;
  min-height: 560px;
  max-width: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.dial { position: relative; width: min(100%, 300px); max-width: 100%; aspect-ratio: 1; margin-inline: auto; }
.ticks { position: absolute; inset: 0; width: 100%; height: 100%; }
.tick { stroke: var(--fg); stroke-width: 2.2; stroke-linecap: round; fill: none; }
.tick.off { opacity: 0.1; }
.dial.prep .tick:not(.off) { opacity: 0.4; }
.inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20%; }
.count { height: 22px; margin-top: 6px; font-size: 15px; color: var(--muted); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time { font-weight: 200; font-size: clamp(46px, 15vw, 66px); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }

.zone { min-height: 120px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip, .add {
  width: 52px; height: 44px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; text-align: center; font-size: 18px; font-weight: 400; padding: 0;
  font-variant-numeric: tabular-nums;
}
.chip:focus { outline: none; border-color: var(--fg); }
.add { color: var(--muted); font-size: 22px; line-height: 1; }
.add:hover { color: var(--fg); border-color: var(--muted); }
.note { margin: 0; font-size: 13px; color: var(--muted); }

.main {
  width: 88px; height: 88px; border-radius: 50%; border: 0; padding: 0;
  background: var(--fg); color: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.main svg { display: block; }
.reset { margin-top: 18px; height: 44px; padding: 0 16px; background: transparent; border: 0; color: var(--muted); font-size: 15px; }
.reset:hover { color: var(--fg); }
</style>

</head>
<body>
<main class="app">
  <div class="dial" id="dial">
    <svg class="ticks" id="ticks" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
    <div class="inner">
      <div class="time" id="time"></div>
      <div class="count" id="count"></div>
    </div>
  </div>
  <div class="zone" id="zone">
    <div class="chips" id="chips"></div>
    <p class="note" id="note">minuti per pratica · svuota un campo per toglierlo</p>
  </div>
  <button class="main" id="main" type="button"></button>
  <button class="reset" id="reset" type="button">Azzera</button>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'timer-gong-v2', PREP = 5;

  function clampMin(v) {
    if (!isFinite(v)) return 2;
    return Math.min(180, Math.max(0.5, Math.round(v * 2) / 2));
  }
  var steps = [2, 2, 2, 6, 6];
  try {
    var r = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(r) && r.length) steps = r.slice(0, 20).map(function (x) { return clampMin(+x); });
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(steps)); } catch (e) {} }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtMin(v) { return String(+v.toFixed(2)).replace('.', ','); }

  /* ---------- gong: sintesi in campioni ---------- */
  var SR = 11025, MAXAUDIO = 3600;
  var PARTIALS = [[1, 1, 1], [1.004, 0.75, 0.95], [2.756, 0.5, 0.7], [2.766, 0.32, 0.65], [5.404, 0.3, 0.45], [8.933, 0.16, 0.3], [13.34, 0.08, 0.2]];
  function synthGong(f0, dur, tau) {
    var n = Math.floor(SR * dur), d = new Float32Array(n), TWO = 2 * Math.PI, i, k;
    for (k = 0; k < PARTIALS.length; k++) {
      var r = PARTIALS[k][0], a = PARTIALS[k][1], T = tau * PARTIALS[k][2];
      if (f0 * r > SR * 0.45) continue;
      var w = TWO * f0 * r / SR, bloom = r > 2 ? 0.06 : 0.004;
      for (i = 0; i < n; i++) {
        var t = i / SR;
        d[i] += a * Math.sin(w * i) * Math.exp(-t / T) * (1 - Math.exp(-t / bloom));
      }
    }
    var seed = 1, y = 0, nn = Math.min(n, Math.floor(SR * 0.05));
    for (i = 0; i < nn; i++) {
      seed = (seed * 16807) % 2147483647;
      var x = (seed / 2147483647) * 2 - 1;
      y += 0.25 * (x - y);
      var tt = i / SR;
      d[i] += y * 0.9 * Math.exp(-tt / 0.012) * (1 - Math.exp(-tt / 0.001));
    }
    var peak = 0;
    for (i = 0; i < n; i++) { var v = Math.abs(d[i]); if (v > peak) peak = v; }
    var g = peak > 0 ? 0.9 / peak : 1, fade = Math.floor(SR * 0.4);
    for (i = 0; i < n; i++) {
      d[i] *= g;
      if (i > n - fade) d[i] *= (n - i) / fade;
    }
    return d;
  }
  var gongCache = null;
  function gongs() {
    if (!gongCache) gongCache = { short: synthGong(238, 6, 1.5), end: synthGong(168, 13, 3.4) };
    return gongCache;
  }

  /* ---------- file WAV in memoria ---------- */
  function newWav(n) {
    var buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    return { buf: buf, pcm: new Int16Array(buf, 44, n) };
  }
  function wavUrl(buf) { return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); }
  function addTo(pcm, src, at, gain) {
    var s0 = Math.round(at * SR), n = pcm.length;
    for (var i = 0; i < src.length && s0 + i < n; i++) {
      var v = pcm[s0 + i] + src[i] * gain * 30000;
      pcm[s0 + i] = v > 32767 ? 32767 : (v < -32768 ? -32768 : v);
    }
  }

  /* ---------- sequenza ---------- */
  var tl = null;
  function buildTL() {
    var durs = steps.map(function (m) { return Math.round(m * 60); });
    var cum = [0];
    durs.forEach(function (d) { cum.push(cum[cum.length - 1] + d); });
    var T = PREP + cum[cum.length - 1];
    var events = durs.map(function (_, i) { return { p: PREP + cum[i], kind: 'start' }; });
    events.push({ p: T, kind: 'end' });
    return { durs: durs, cum: cum, T: T, events: events };
  }
  function indexAt(q) {
    for (var i = tl.durs.length - 1; i >= 0; i--) { if (q >= tl.cum[i]) return i; }
    return 0;
  }

  /* ---------- audio: l'intera sessione come un unico file, gong inclusi ---------- */
  var aud = null, audUrl = null, testAud = null;
  function freeAudio() {
    if (aud) {
      try { aud.pause(); aud.removeAttribute('src'); aud.load(); } catch (e) {}
      aud = null;
    }
    if (audUrl) { try { URL.revokeObjectURL(audUrl); } catch (e) {} audUrl = null; }
  }
  function prepareAudio() {
    freeAudio();
    if (tl.T > MAXAUDIO) return;
    try {
      var g = gongs(), wav = newWav(Math.ceil((tl.T + 17) * SR));
      tl.events.forEach(function (e) {
        if (e.kind === 'end') { addTo(wav.pcm, g.end, e.p, 1); addTo(wav.pcm, g.end, e.p + 3.4, 0.6); }
        else addTo(wav.pcm, g.short, e.p, 1);
      });
      audUrl = wavUrl(wav.buf);
      aud = new Audio(audUrl);
      aud.preload = 'auto';
      aud.setAttribute('playsinline', '');
    } catch (e) { aud = null; }
  }
  function playAudio(from) {
    if (!aud) return;
    try {
      if (from > 0) aud.currentTime = from;
      var pr = aud.play();
      if (pr && pr.catch) pr.catch(function () {});
    } catch (e) {}
  }

  /* ---------- motore (il tempo segue l'audio quando suona, altrimenti l'orologio) ---------- */
  var mode = 'idle'; /* idle | running | paused | done */
  var t0 = 0, elapsed = 0, timer = null, wl = null;
  function now() { return performance.now() / 1000; }
  function currentP() {
    if (mode !== 'running') return elapsed;
    if (aud && !aud.paused && !aud.ended && aud.readyState >= 2 && aud.currentTime > 0.05) return aud.currentTime;
    return now() - t0;
  }
  function lockScreen() {
    try {
      if ('wakeLock' in navigator && !wl) {
        navigator.wakeLock.request('screen').then(function (l) {
          wl = l;
          l.addEventListener('release', function () { wl = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function unlockScreen() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
  function startTimer() { stopTimer(); timer = setInterval(tick, 100); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function begin() {
    t0 = now() - elapsed;
    mode = 'running';
    playAudio(elapsed);
    lockScreen();
    startTimer();
    render();
    tick();
  }
  function pause() {
    elapsed = currentP();
    mode = 'paused';
    if (aud) { try { aud.pause(); } catch (e) {} }
    stopTimer(); unlockScreen();
    render();
    paint(elapsed);
  }
  function finish() {
    mode = 'done';
    elapsed = tl.T;
    stopTimer(); unlockScreen();
    render();
    paint(tl.T);
  }
  function resetAll() {
    freeAudio(); stopTimer(); unlockScreen();
    mode = 'idle'; elapsed = 0;
    tl = buildTL();
    render();
    paint(0);
  }
  function tick() {
    var p = currentP();
    if (mode === 'running' && p >= tl.T) { finish(); return; }
    paint(p);
  }

  /* ---------- interfaccia ---------- */
  var ICON_PLAY = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M8 5.2v13.6L19.5 12z" fill="currentColor"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

  /* anello di tacche: 120 linee radiali che si spengono in senso orario */
  var NT = 120, tickEls = [], lastVis = -1;
  (function () {
    var svg = $('ticks');
    for (var i = 0; i < NT; i++) {
      var a = i / NT * 2 * Math.PI - Math.PI / 2;
      var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', (80 * Math.cos(a)).toFixed(2));
      l.setAttribute('y1', (80 * Math.sin(a)).toFixed(2));
      l.setAttribute('x2', (98 * Math.cos(a)).toFixed(2));
      l.setAttribute('y2', (98 * Math.sin(a)).toFixed(2));
      l.setAttribute('class', 'tick');
      svg.appendChild(l);
      tickEls.push(l);
    }
  })();
  function setRing(rem, prep) {
    var vis = Math.ceil(Math.min(1, Math.max(0, rem)) * NT - 1e-6);
    $('dial').classList.toggle('prep', prep);
    if (vis === lastVis) return;
    lastVis = vis;
    for (var i = 0; i < NT; i++) tickEls[i].setAttribute('class', i >= NT - vis ? 'tick' : 'tick off');
  }

  function paint(p) {
    var n = tl.durs.length, total = tl.T - PREP, count = '', time, rem = 1, inPrep = false;
    if (mode === 'idle') {
      time = fmt(total);
    } else if (mode === 'done') {
      count = 'Fine'; time = fmt(total); rem = 0;
    } else if (p < PREP) {
      inPrep = true;
      count = mode === 'paused' ? 'In pausa' : 'Preparati';
      time = fmt(Math.ceil(PREP - p - 1e-6));
      rem = 1 - p / PREP;
    } else {
      var q = p - PREP, idx = indexAt(q);
      count = (mode === 'paused' ? 'In pausa · ' : '') + (idx + 1) + ' / ' + n;
      time = fmt(Math.ceil(tl.cum[idx + 1] - q - 1e-6));
      rem = 1 - (q - tl.cum[idx]) / tl.durs[idx];
    }
    $('count').textContent = count;
    $('time').textContent = time;
    setRing(rem, inPrep);
  }
  function render() {
    var label = { idle: 'Inizia', running: 'Pausa', paused: 'Riprendi', done: 'Ricomincia' }[mode];
    $('main').innerHTML = mode === 'running' ? ICON_PAUSE : ICON_PLAY;
    $('main').setAttribute('aria-label', label);
    $('reset').style.visibility = mode === 'idle' ? 'hidden' : 'visible';
    $('zone').style.visibility = mode === 'idle' ? 'visible' : 'hidden';
  }
  function changed() {
    save(); tl = buildTL(); paint(0);
    $('note').textContent = tl.T > MAXAUDIO
      ? 'Oltre 60 minuti il gong non è disponibile'
      : 'minuti per pratica · svuota un campo per toglierlo';
  }

  function renderChips() {
    var box = $('chips');
    box.textContent = '';
    steps.forEach(function (v, i) {
      var inp = document.createElement('input');
      inp.type = 'text'; inp.inputMode = 'decimal'; inp.className = 'chip'; inp.id = 'chip-' + i;
      inp.value = fmtMin(v);
      inp.setAttribute('aria-label', 'Durata in minuti, pratica ' + (i + 1));
      inp.addEventListener('focus', function () { inp.select(); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') inp.blur(); });
      inp.addEventListener('change', function () {
        var t = inp.value.trim().replace(',', '.');
        if (t === '') {
          if (steps.length > 1) { steps.splice(i, 1); renderChips(); changed(); }
          else inp.value = fmtMin(steps[i]);
          return;
        }
        var nv = parseFloat(t);
        steps[i] = nv > 0 ? clampMin(nv) : steps[i];
        inp.value = fmtMin(steps[i]);
        changed();
      });
      box.appendChild(inp);
    });
    if (steps.length < 20) {
      var add = document.createElement('button');
      add.type = 'button'; add.className = 'add'; add.id = 'add'; add.textContent = '+';
      add.setAttribute('aria-label', 'Aggiungi pratica');
      add.addEventListener('click', function () {
        steps.push(steps[steps.length - 1]);
        renderChips(); changed();
      });
      box.appendChild(add);
    }
  }

  $('main').addEventListener('click', function () {
    if (mode === 'idle' || mode === 'done') {
      tl = buildTL(); elapsed = 0;
      prepareAudio();
      begin();
    } else if (mode === 'running') {
      pause();
    } else if (mode === 'paused') {
      begin();
    }
  });
  $('reset').addEventListener('click', resetAll);
  $('dial').addEventListener('click', function () {
    if (mode !== 'idle') return;
    try {
      if (testAud) { testAud.pause(); testAud = null; }
      var d = gongs().short, wav = newWav(d.length), url;
      for (var i = 0; i < d.length; i++) wav.pcm[i] = d[i] * 30000;
      url = wavUrl(wav.buf);
      testAud = new Audio(url);
      testAud.onended = function () { try { URL.revokeObjectURL(url); } catch (e) {} };
      var pr = testAud.play();
      if (pr && pr.catch) pr.catch(function () {});
    } catch (e) {}
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && mode === 'running') {
      lockScreen();
      tick();
    }
  });

  setTimeout(gongs, 400);
  tl = buildTL();
  renderChips();
  render();
  paint(0);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer Gong</title>
<meta name="description" content="Timer a sequenza per la meditazione, con gong.">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timer Gong">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;400;500&display=swap">
<style>
/* Layout: una sola colonna centrata. Numero grande, durate come piccole pillole, un pulsante tondo. Nessun altro elemento. */
:root {
  --bg: #0A0A0A;
  --fg: #F2F2EF;
  --muted: #7E7E79;
  --line: #2B2B29;
  --font: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FAFAF7;
    --fg: #111110;
    --muted: #84847E;
    --line: #DCDCD6;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FAFAF7;
  --fg: #111110;
  --muted: #84847E;
  --line: #DCDCD6;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.app {
  height: 100%;
  min-height: 560px;
  max-width: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.dial { position: relative; width: min(100%, 300px); max-width: 100%; aspect-ratio: 1; margin-inline: auto; }
.ticks { position: absolute; inset: 0; width: 100%; height: 100%; }
.tick { stroke: var(--fg); stroke-width: 2.2; stroke-linecap: round; fill: none; }
.tick.off { opacity: 0.1; }
.dial.prep .tick:not(.off) { opacity: 0.4; }
.inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20%; }
.count { height: 22px; margin-top: 6px; font-size: 15px; color: var(--muted); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time { font-weight: 200; font-size: clamp(46px, 15vw, 66px); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }

.zone { min-height: 120px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip, .add {
  width: 52px; height: 44px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; text-align: center; font-size: 18px; font-weight: 400; padding: 0;
  font-variant-numeric: tabular-nums;
}
.chip:focus { outline: none; border-color: var(--fg); }
.add { color: var(--muted); font-size: 22px; line-height: 1; }
.add:hover { color: var(--fg); border-color: var(--muted); }
.note { margin: 0; font-size: 13px; color: var(--muted); }

.main {
  width: 88px; height: 88px; border-radius: 50%; border: 0; padding: 0;
  background: var(--fg); color: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.main svg { display: block; }
.reset { margin-top: 18px; height: 44px; padding: 0 16px; background: transparent; border: 0; color: var(--muted); font-size: 15px; }
.reset:hover { color: var(--fg); }
.status { margin: 4px 0 0; max-width: 320px; font-size: 12px; line-height: 1.45; color: var(--muted); text-wrap: balance; }
</style>

</head>
<body>
<main class="app">
  <div class="dial" id="dial">
    <svg class="ticks" id="ticks" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
    <div class="inner">
      <div class="time" id="time"></div>
      <div class="count" id="count"></div>
    </div>
  </div>
  <div class="zone" id="zone">
    <div class="chips" id="chips"></div>
    <p class="note" id="note">minuti per pratica · svuota per togliere · tocca il cerchio per il gong</p>
  </div>
  <button class="main" id="main" type="button"></button>
  <button class="reset" id="reset" type="button">Azzera</button>
  <p class="status" id="status" role="status" hidden></p>
  <audio id="player" preload="auto" playsinline></audio>
  <audio id="tester" src="gong.wav" preload="auto" playsinline></audio>
</main>

<script src="audio.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'timer-gong-v2', PREP = 5, A = window.TimerAudio;

  function clampMin(v) {
    if (!isFinite(v)) return 2;
    return Math.min(180, Math.max(0.5, Math.round(v * 2) / 2));
  }
  var steps = [2, 2, 2, 6, 6];
  try {
    var r = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(r) && r.length) steps = r.slice(0, 20).map(function (x) { return clampMin(+x); });
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(steps)); } catch (e) {} }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtMin(v) { return String(+v.toFixed(2)).replace('.', ','); }
  function now() { return performance.now() / 1000; }

  /* ---------- sequenza ---------- */
  var tl = null;
  function buildTL() { return A.timeline(steps, PREP); }
  function indexAt(q) {
    for (var i = tl.durs.length - 1; i >= 0; i--) { if (q >= tl.cum[i]) return i; }
    return 0;
  }

  /* ---------- audio ----------
     La sessione e' un unico file audio con i gong gia' al loro posto.
     Fonti, in ordine: 'sw' = session.wav generato dal service worker (indirizzo normale),
     'blob' = file generato nella pagina. Se una fonte fallisce si passa alla successiva.
     Se nessuna funziona, il timer continua e una riga sotto il pulsante dice perche'. */
  var player = $('player'), tester = $('tester');
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var forced = (location.hash.match(/^#audio-(sw|blob)$/) || [])[1];
  var sources = [], srcIdx = -1, gen = 0, audioOn = false, failures = [], blobUrl = null;
  var selfPause = false, lastLoad = -10;

  // Prova: nessuna impostazione della sessione audio. Su alcune versioni di iOS
  // audioSession.type = 'playback' zittisce le app aggiunte alla Home. Con #playback si riattiva.
  function playbackSession() {
    if (location.hash !== '#playback') return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  }
  playbackSession();

  function status(msg) { var el = $('status'); el.textContent = msg || ''; el.hidden = !msg; }

  function freeBlob() { if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = null; } }
  function urlFor(kind) {
    if (kind === 'sw') return 'session.wav?p=' + PREP + '&s=' + steps.join(',');
    freeBlob();
    var buf = A.sessionWav(steps, PREP);
    if (!buf) return null;
    blobUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    return blobUrl;
  }
  function planSources() {
    var hasSW = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
    var order = forced ? [forced] : (standalone ? ['sw', 'blob'] : ['blob', 'sw']);
    return order.filter(function (k) { return k !== 'sw' || hasSW; });
  }
  function loadSource(i) {
    srcIdx = i; gen++;
    var url = null;
    try { url = urlFor(sources[i]); } catch (e) { url = null; }
    if (!url) { failures.push(sources[i] + ': non generato'); return false; }
    selfPause = true; lastLoad = now();
    player.src = url;
    try { player.load(); } catch (e) {}
    return true;
  }
  function loadFirstFrom(i) {
    for (; i < sources.length; i++) { if (loadSource(i)) return true; }
    return false;
  }
  function seekTo(t) {
    if (t <= 0.05) return;
    if (player.readyState >= 1) { try { player.currentTime = t; } catch (e) {} return; }
    var g = gen;
    player.addEventListener('loadedmetadata', function once() {
      player.removeEventListener('loadedmetadata', once);
      if (g !== gen) return;
      try { player.currentTime = currentP(); } catch (e) {}
    });
  }
  function playFrom(t) {
    if (!audioOn) return;
    seekTo(t);
    selfPause = false;
    var g = gen;
    try {
      var pr = player.play();
      if (pr && pr.catch) pr.catch(function (e) {
        if (e && e.name === 'AbortError') return;
        fail(g, sources[srcIdx] + ': ' + ((e && e.name) || 'errore'));
      });
    } catch (e) { fail(g, sources[srcIdx] + ': ' + (e.name || 'errore')); }
  }
  function fail(g, reason) {
    if (g !== gen || !audioOn) return;
    failures.push(reason);
    if (loadFirstFrom(srcIdx + 1)) {
      if (mode === 'running') playFrom(currentP());
      return;
    }
    audioOn = false;
    status('Gong non riprodotto · ' + failures.join(' · '));
  }
  function stopAudio() {
    gen++; audioOn = false; selfPause = true;
    try { player.pause(); } catch (e) {}
    try { player.removeAttribute('src'); player.load(); } catch (e) {}
    freeBlob();
  }

  player.addEventListener('error', function () {
    if (!audioOn || !player.getAttribute('src')) return;
    fail(gen, sources[srcIdx] + ': errore ' + (player.error ? player.error.code : '?'));
  });
  // Se il sistema ferma l'audio (chiamata, controlli della schermata di blocco), si ferma anche il timer,
  // dal punto in cui il suono si e' interrotto: cosi' tempo e gong non si sfasano mai.
  player.addEventListener('pause', function () {
    if (selfPause || mode !== 'running' || player.ended || !audioOn) return;
    if (now() - lastLoad < 1.5) return;
    pause(player.currentTime > 0.05 ? player.currentTime : undefined);
  });

  /* gong di prova: tocco sul cerchio a timer fermo, file statico gong.wav */
  tester.addEventListener('error', function () {
    status('Gong di prova non caricato · errore ' + (tester.error ? tester.error.code : '?'));
  });
  function testGong() {
    playbackSession();
    status('');
    try { tester.currentTime = 0; } catch (e) {}
    try {
      var pr = tester.play();
      if (pr && pr.catch) pr.catch(function (e) {
        if (e && e.name === 'AbortError') return;
        status('Gong di prova non riprodotto · ' + ((e && e.name) || 'errore'));
      });
    } catch (e) { status('Gong di prova non riprodotto · ' + (e.name || 'errore')); }
  }

  /* controlli nella schermata di blocco e nel Centro di Controllo */
  function mediaState() {
    try { if (navigator.mediaSession) navigator.mediaSession.playbackState = mode === 'running' ? 'playing' : 'paused'; } catch (e) {}
  }
  try {
    if ('mediaSession' in navigator) {
      if (window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Timer Gong', artist: 'Meditazione',
          artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
        });
      }
      navigator.mediaSession.setActionHandler('play', function () { if (mode === 'paused') begin(); });
      navigator.mediaSession.setActionHandler('pause', function () { if (mode === 'running') pause(); });
    }
  } catch (e) {}

  /* ---------- motore: il tempo segue l'audio quando suona, altrimenti l'orologio ---------- */
  var mode = 'idle'; /* idle | running | paused | done */
  var t0 = 0, elapsed = 0, timer = null, wl = null;
  function currentP() {
    if (mode !== 'running') return elapsed;
    if (audioOn && !player.paused && !player.ended && player.readyState >= 2 && player.currentTime > 0.05) {
      t0 = now() - player.currentTime;
      return player.currentTime;
    }
    return now() - t0;
  }
  function lockScreen() {
    try {
      if ('wakeLock' in navigator && !wl) {
        navigator.wakeLock.request('screen').then(function (l) {
          wl = l;
          l.addEventListener('release', function () { wl = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function unlockScreen() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
  function startTimer() { stopTimer(); timer = setInterval(tick, 100); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function startSession() {
    stopAudio();
    tl = buildTL(); elapsed = 0; failures = [];
    status('');
    playbackSession();
    sources = planSources();
    audioOn = tl.T <= A.MAXAUDIO && loadFirstFrom(0);
    if (!audioOn && tl.T <= A.MAXAUDIO) status('Gong non riprodotto · ' + (failures.join(' · ') || 'nessuna fonte audio'));
    begin();
  }
  function begin() {
    t0 = now() - elapsed;
    mode = 'running';
    playFrom(elapsed);
    lockScreen();
    startTimer();
    render();
    mediaState();
    tick();
  }
  function pause(at) {
    elapsed = typeof at === 'number' ? Math.min(at, tl.T) : currentP();
    mode = 'paused';
    selfPause = true;
    try { player.pause(); } catch (e) {}
    stopTimer(); unlockScreen();
    render();
    mediaState();
    paint(elapsed);
  }
  function finish() {
    mode = 'done';          // l'audio continua: i due gong finali risuonano fino in fondo
    elapsed = tl.T;
    stopTimer(); unlockScreen();
    render();
    mediaState();
    paint(tl.T);
  }
  function resetAll() {
    stopAudio(); stopTimer(); unlockScreen();
    mode = 'idle'; elapsed = 0;
    tl = buildTL();
    status('');
    render();
    mediaState();
    paint(0);
  }
  function tick() {
    var p = currentP();
    if (mode === 'running' && p >= tl.T) { finish(); return; }
    paint(p);
  }

  /* ---------- interfaccia ---------- */
  var ICON_PLAY = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M8 5.2v13.6L19.5 12z" fill="currentColor"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

  /* anello di tacche: 120 linee radiali che si spengono in senso orario */
  var NT = 120, tickEls = [], lastVis = -1;
  (function () {
    var svg = $('ticks');
    for (var i = 0; i < NT; i++) {
      var a = i / NT * 2 * Math.PI - Math.PI / 2;
      var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', (80 * Math.cos(a)).toFixed(2));
      l.setAttribute('y1', (80 * Math.sin(a)).toFixed(2));
      l.setAttribute('x2', (98 * Math.cos(a)).toFixed(2));
      l.setAttribute('y2', (98 * Math.sin(a)).toFixed(2));
      l.setAttribute('class', 'tick');
      svg.appendChild(l);
      tickEls.push(l);
    }
  })();
  function setRing(rem, prep) {
    var vis = Math.ceil(Math.min(1, Math.max(0, rem)) * NT - 1e-6);
    $('dial').classList.toggle('prep', prep);
    if (vis === lastVis) return;
    lastVis = vis;
    for (var i = 0; i < NT; i++) tickEls[i].setAttribute('class', i >= NT - vis ? 'tick' : 'tick off');
  }

  function paint(p) {
    var n = tl.durs.length, total = tl.T - PREP, count = '', time, rem = 1, inPrep = false;
    if (mode === 'idle') {
      time = fmt(total);
    } else if (mode === 'done') {
      count = 'Fine'; time = fmt(total); rem = 0;
    } else if (p < PREP) {
      inPrep = true;
      count = mode === 'paused' ? 'In pausa' : 'Preparati';
      time = fmt(Math.ceil(PREP - p - 1e-6));
      rem = 1 - p / PREP;
    } else {
      var q = p - PREP, idx = indexAt(q);
      count = (mode === 'paused' ? 'In pausa · ' : '') + (idx + 1) + ' / ' + n;
      time = fmt(Math.ceil(tl.cum[idx + 1] - q - 1e-6));
      rem = 1 - (q - tl.cum[idx]) / tl.durs[idx];
    }
    $('count').textContent = count;
    $('time').textContent = time;
    setRing(rem, inPrep);
  }
  function render() {
    var label = { idle: 'Inizia', running: 'Pausa', paused: 'Riprendi', done: 'Ricomincia' }[mode];
    $('main').innerHTML = mode === 'running' ? ICON_PAUSE : ICON_PLAY;
    $('main').setAttribute('aria-label', label);
    $('reset').style.visibility = mode === 'idle' ? 'hidden' : 'visible';
    $('zone').style.visibility = mode === 'idle' ? 'visible' : 'hidden';
  }
  function updateNote() {
    $('note').textContent = tl.T > A.MAXAUDIO
      ? 'Oltre 60 minuti il gong non è disponibile'
      : 'minuti per pratica · svuota per togliere · tocca il cerchio per il gong';
  }
  function changed() { save(); tl = buildTL(); paint(0); updateNote(); }

  function renderChips() {
    var box = $('chips');
    box.textContent = '';
    steps.forEach(function (v, i) {
      var inp = document.createElement('input');
      inp.type = 'text'; inp.inputMode = 'decimal'; inp.className = 'chip'; inp.id = 'chip-' + i;
      inp.value = fmtMin(v);
      inp.setAttribute('aria-label', 'Durata in minuti, pratica ' + (i + 1) + '. Svuota il campo per toglierla.');
      inp.addEventListener('focus', function () { inp.select(); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') inp.blur(); });
      inp.addEventListener('change', function () {
        var t = inp.value.trim().replace(',', '.');
        if (t === '') {
          if (steps.length > 1) { steps.splice(i, 1); renderChips(); changed(); }
          else inp.value = fmtMin(steps[i]);
          return;
        }
        var nv = parseFloat(t);
        steps[i] = nv > 0 ? clampMin(nv) : steps[i];
        inp.value = fmtMin(steps[i]);
        changed();
      });
      box.appendChild(inp);
    });
    if (steps.length < 20) {
      var add = document.createElement('button');
      add.type = 'button'; add.className = 'add'; add.id = 'add'; add.textContent = '+';
      add.setAttribute('aria-label', 'Aggiungi pratica');
      add.addEventListener('click', function () {
        steps.push(steps[steps.length - 1]);
        renderChips(); changed();
      });
      box.appendChild(add);
    }
  }

  $('main').addEventListener('click', function () {
    if (mode === 'idle' || mode === 'done') startSession();
    else if (mode === 'running') pause();
    else if (mode === 'paused') begin();
  });
  $('reset').addEventListener('click', resetAll);
  $('dial').addEventListener('click', function () { if (mode === 'idle') testGong(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && mode === 'running') {
      lockScreen();
      tick();
    }
  });

  tl = buildTL();
  renderChips();
  render();
  updateNote();
  paint(0);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
